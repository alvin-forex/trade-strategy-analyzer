name: regression

# L17 測試金字塔 — CI 門禁(白皮書 v1.3 §8.2 Task C)
# 紅燈 = 禁止 merge main。
# 覆蓋:golden 回歸(凍結 baseline) + L21 dead-link 門禁(P1-fast 介面快修)。
#
# v1.3.1 修復:
#   - push 觸發原為 branches: ain](typo 致 main push 從未觸發 golden job),改為全 branch 觸發
#   - 移除 sparse-checkout(引擎檔案 docs/martin_v4_engine.js 等不在 sparse 集內,golden 測試環境不完整)
#   - 新增 link-check job:L21 站內死連結門禁(941 頁全掃,Pages 語義,2026-10-21)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  golden:
    name: Golden baseline (engine regression)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout(full — engine + tests + data 均在 repo)
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Golden regression tests(引擎行為 vs 凍結 baseline)
        run: node --test tests/golden.test.mjs

      - name: L18 low-sample boundary tests(主頁倉位評分 np 邊界,白皮書 Step 2)
        run: node --test tests/test_l18_low_sample.mjs

      - name: Watchdog retry script regression(L28 rc 傳遞,VPS ops 腳本)
        run: bash tests/test_watchdog_retry.sh

      - name: Backup second-location alert regression(L29 weekly/monthly 靜默,VPS ops 腳本)
        run: bash tests/test_backup_second_alert.sh

  link-check:
    name: L21 dead-link gate (docs/ = Pages root)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Site-wide link check(941 頁 / 全站內連結)
        run: python tests/link_check.py

  encryption-check:
    name: L22 staticrypt gate (core pages stay encrypted)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Core pages StatiCrypt check(14 頁防復活,7ad97b7f)
        run: python tests/encryption_check.py

  language-check:
    name: L23 language gate (系統文字只可英文或繁體中文)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Simplified-Chinese gate(老闆指示 2026-10-30;643 檔全掃)
        run: python tests/language_check.py

  freshness-check:
    name: L22 data-freshness gate (no stale data labelled today)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ④ 站務退休（2026-10-28，老闆批「可以刪」）：4H/每日報告退休，
      # generate_forex_hub.py＋ freshness 門禁一齊退——數據 lane 已刪 docs/admin/4h_reports/、forex_hub/ 舊位（ece4979）。
