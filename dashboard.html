<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🦀 交易策略分析系統</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0e17;color:#d0d0d0;padding:20px;min-height:100vh}
.container{max-width:800px;margin:0 auto}
h1{text-align:center;color:#FFD700;font-size:1.5em;margin-bottom:4px}
.sub{text-align:center;color:#666;font-size:0.85em;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:16px}
.card{background:#111520;border:1px solid #1e2433;border-radius:10px;padding:20px;text-decoration:none;color:#d0d0d0;transition:all .2s}
.card:hover{border-color:#FFD700;transform:translateY(-2px);box-shadow:0 4px 20px rgba(255,215,0,0.1)}
.card .icon{font-size:2em;margin-bottom:8px}
.card .title{font-size:1.1em;font-weight:bold;color:#f8fafc;margin-bottom:4px}
.card .desc{font-size:0.8em;color:#888}
.card .tag{display:inline-block;margin-top:8px;padding:2px 8px;border-radius:4px;font-size:0.7em;font-weight:bold}
.tag-v4{background:#1b5e20;color:#4CAF50}
.tag-v3{background:#1a237e;color:#90caf9}
.tag-data{background:#4a148c;color:#ce93d8}
.footer{text-align:center;color:#333;font-size:0.7em;margin-top:32px;padding-top:12px;border-top:1px solid #1a1f2e}
</style>
</head>
<body>
<div class="container">
<h1>🦀 交易策略分析系統</h1>
<p class="sub">AlgoForest Signal Analysis Dashboard</p>

<div class="grid">

<a class="card" href="signal_ranking_dde_v4.html">
<div class="icon">🏆</div>
<div class="title">Signal 排名表</div>
<div class="desc">DDE v4 評分 — WR 20% + HT 5% + TC 15% + ML 25% + RR 35%</div>
<span class="tag tag-v4">DDE v4</span>
</a>

<a class="card" href="reports/ranking_ccy.html">
<div class="icon">💱</div>
<div class="title">CCY 排名表</div>
<div class="desc">按貨幣對分析 — Lot-based Layer 排名</div>
<span class="tag tag-v3">DDE v4 CCY</span>
</a>

<a class="card" href="ccy_timeframe_volatility.html">
<div class="icon">📊</div>
<div class="title">CCY × TF 波幅表</div>
<div class="desc">每隻貨幣對喺唔同 Timeframe 嘅平均波幅、MFE、MAE</div>
<span class="tag tag-data">VOLATILITY</span>
</a>

</div>

<p class="footer">🦀 丁蟹分析 | 數據來源：AlgoForest Signals | <span id="date"></span></p>
</div>
<script>document.getElementById('date').textContent=new Date().toLocaleDateString('zh-HK')</script>
</body>
</html>
