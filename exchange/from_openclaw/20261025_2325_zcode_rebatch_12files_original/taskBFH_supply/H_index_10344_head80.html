<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">><title>Trade Strategy Analysis Report</title><style>
:root {
  --primary: #0f3460;
  --accent: #e94560;
  --bg: #f5f7fa;
  --card: #fff;
  --text: #333;
  --text2: #666;
  --green: #28a745;
  --yellow: #ffc107;
  --orange: #fd7e14;
  --red: #dc3545;
  --grade-a: #28a745;
  --grade-b: #ffc107;
  --grade-c: #fd7e14;
  --grade-d: #dc3545;
  --radius: 12px;
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

/* Header */
.header { text-align: center; padding: 40px 20px 24px; background: linear-gradient(135deg, var(--primary) 0%, #16213e 100%); margin: -24px -16px 24px; padding-left: 36px; padding-right: 36px; }
.header h1 { color: #fff; font-size: 1.8em; }
.header .sub { color: #a8d8ea; font-size: 0.9em; margin-top: 4px; }

/* Cards */
.card { background: var(--card); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
.card h2 { font-size: 1.15em; color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.card h2 .icon { font-size: 1.2em; }

/* Upload */
.upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
@media (max-width: 500px) { .upload-grid { grid-template-columns: 1fr; } }
.upload-zone { border: 2px dashed #c0c8d8; border-radius: var(--radius); padding: 28px 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
.upload-zone:hover { border-color: var(--accent); background: #fef5f7; }
.upload-zone.has-file { border-color: var(--green); background: #f0faf3; border-style: solid; }
.upload-zone .icon { font-size: 2.4em; }
.upload-zone .label { font-weight: 600; color: var(--primary); font-size: 0.95em; }
.upload-zone .hint { font-size: 0.8em; color: #999; }

.file-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: #eef2f7; padding: 4px 10px; border-radius: 20px; font-size: 0.82em; }
.chip .remove { cursor: pointer; color: var(--red); font-weight: bold; }

.btn { display: block; width: 100%; padding: 14px; border: none; border-radius: var(--radius); font-size: 1.05em; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; }
.btn-primary:hover { box-shadow: 0 4px 20px rgba(233,69,96,0.35); transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

.progress { height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin-top: 12px; display: none; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: width 0.4s; }
.error { color: var(--red); background: #fde8ea; padding: 10px 14px; border-radius: 8px; margin-top: 10px; display: none; font-size: 0.9em; }

/* Stats Grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat-box { background: #f8f9fb; border-radius: 10px; padding: 14px 12px; text-align: center; }
.stat-box .val { font-size: 1.3em; font-weight: 700; color: var(--primary); }
.stat-box .val.positive { color: var(--green); }
.stat-box .val.negative { color: var(--red); }
.stat-box .lbl { font-size: 0.75em; color: var(--text2); margin-top: 2px; }

/* Copy Grade */
.copy-grade { text-align: center; padding: 16px; background: linear-gradient(135deg, #e8f5e9, #fff8e1); border-radius: var(--radius); margin-bottom: 16px; }
.copy-grade .stars { font-size: 2em; }
.copy-grade .verdict { font-weight: 600; margin-top: 4px; }

/* Tables */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
th { background: var(--primary); color: #fff; padding: 10px 8px; text-align: center; white-space: nowrap; position: sticky; top: 0; }
td { padding: 8px; border-bottom: 1px solid #eee; text-align: center; white-space: nowrap; }
tr:hover td { background: #f0f4ff; }
.sortable th { cursor: pointer; user-select: none; }
.sortable th:hover { background: #1a4a8a; }
.sort-arrow { font-size: 0.7em; margin-left: 2px; }

/* Grade Badges */
