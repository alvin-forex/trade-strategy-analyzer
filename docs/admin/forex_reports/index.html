<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📰 外匯報告列表</title>


<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f172a; color:#e2e8f0; padding:20px; }
.header { text-align:center; padding:20px 0; border-bottom:1px solid #1e293b; margin-bottom:20px; }
.header h1 { font-size:24px; color:#38bdf8; }
.header .sub { color:#94a3b8; font-size:13px; margin-top:4px; }
.reports-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; max-width:900px; margin:0 auto; }
.report-card { background:#1e293b; border-radius:12px; padding:16px; transition:0.2s; }
.report-card:hover { background:#334155; transform:translateY(-2px); }
.report-card .date { font-size:18px; font-weight:600; color:#f8fafc; margin-bottom:8px; }
.report-card .type { font-size:12px; color:#94a3b8; margin-bottom:12px; }
.report-links { display:flex; gap:8px; flex-wrap:wrap; }
.report-links a { display:inline-flex; align-items:center; gap:4px; padding:8px 12px; background:#0f3460; color:#38bdf8; border-radius:6px; font-size:12px; text-decoration:none; transition:0.2s; }
.report-links a:hover { background:#1e4a8a; }
.report-links a.morning { border-left:3px solid #fbbf24; }
.report-links a.evening { border-left:3px solid #8b5cf6; }
.report-links a.extra { border-left:3px solid #3fb950; }
.footer { text-align:center; color:#484f58; font-size:11px; margin:18px 0; }
</style>
</head>
<body class="has-sidebar">
<div class="header">
<h1>📰 外匯報告</h1>
<div class="sub">早晚盤市場分析報告｜共 44 份</div>
</div>
<div class="reports-grid" id="reports-grid"></div>
<div class="footer">Generated by generate_forex_hub.py</div>
<script>
const reports = [
'2026-05-23_morning.html','2026-05-23_evening.html',
'2026-05-24_morning.html','2026-05-24_evening.html',
'2026-05-25_morning.html','2026-05-25_evening.html',
'2026-05-26_morning.html','2026-05-26_evening.html',
'2026-05-28_morning.html','2026-05-28_evening.html',
'2026-05-29_morning.html','2026-05-29_evening.html',
'2026-05-30_morning.html',
'2026-06-01_morning.html','2026-06-01_evening.html',
'2026-06-02_morning.html',
'2026-06-03_morning.html','2026-06-03_evening.html',
'2026-06-04_morning.html','2026-06-04_evening.html',
'2026-06-05_morning.html','2026-06-05_evening.html',
'2026-06-08_morning.html','2026-06-08_evening.html',
'2026-06-09_morning.html',
'2026-06-10_morning.html','2026-06-10_evening.html',
'2026-06-11_morning.html','2026-06-11_evening.html',
'2026-06-12_morning.html','2026-06-12_morning_b.html',
'2026-06-15_morning.html','2026-06-15_evening.html',
'2026-06-16_morning.html','2026-06-16_evening.html',
'2026-06-17_morning.html',
'2026-06-18_morning.html','2026-06-18_evening.html',
'2026-06-22_morning.html','2026-06-22_evening.html',
'2026-06-23_morning.html','2026-06-23_evening.html',
'2026-06-24_morning.html','2026-06-24_evening.html'
];
const grid = document.getElementById('reports-grid');
const dates = {};
reports.forEach(r => {
  const parts = r.replace('.html','').split('_');
  const date = parts[0];
  const type = parts[1] || 'daily';
  if(!dates[date]) dates[date] = {};
  dates[date][type] = r;
});
Object.keys(dates).sort().reverse().forEach(date => {
  const d = dates[date];
  const card = document.createElement('div');
  card.className = 'report-card';
  let links = '';
  const types = Object.keys(d).sort();
  let label = '部分報告';
  if(d.morning && d.evening) label = '完整報告';
  if(types.length > 2) label = types.length + ' 份報告';
  types.forEach(t => {
    if(t === 'morning') links += `<a href="${d[t]}" class="morning">🌅 早盤</a>`;
    else if(t === 'evening') links += `<a href="${d[t]}" class="evening">🌆 晚盤</a>`;
    else if(t === 'morning_b') links += `<a href="${d[t]}" class="extra">🌅 早盤補充</a>`;
    else if(t === 'daily') links += `<a href="${d[t]}" class="extra">📊 日報</a>`;
    else links += `<a href="${d[t]}" class="extra">${t}</a>`;
  });
  card.innerHTML = `<div class="date">${date}</div><div class="type">${label}</div><div class="report-links">${links}</div>`;
  grid.appendChild(card);
});
</script>
</body>
</html>
