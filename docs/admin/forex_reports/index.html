<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📰 外匯報告列表</title>
<link rel="stylesheet" href="../../sidebar.css">
<script src="../../sidebar.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f172a; color:#e2e8f0; padding:20px; }
.header { text-align:center; padding:20px 0; border-bottom:1px solid #1e293b; margin-bottom:20px; }
.header h1 { font-size:24px; color:#38bdf8; }
.header .sub { color:#94a3b8; font-size:13px; margin-top:4px; }
.reports-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; max-width:900px; margin:0 auto; }
.report-card { background:#1e293b; border-radius:12px; padding:16px; transition:0.2s; }
.report-card:hover { background:#334155; transform:translateY(-2px); }
.report-card .date { font-size:18px; font-weight:600; color:#f8fafc; margin-bottom:8px; }
.report-card .type { font-size:12px; color:#94a3b8; margin-bottom:12px; }
.report-links { display:flex; gap:8px; }
.report-links a { display:inline-flex; align-items:center; gap:4px; padding:8px 12px; background:#0f3460; color:#38bdf8; border-radius:6px; font-size:12px; text-decoration:none; transition:0.2s; }
.report-links a:hover { background:#1e4a8a; }
.report-links a.morning { border-left:3px solid #fbbf24; }
.report-links a.evening { border-left:3px solid #8b5cf6; }
</style>
</head>
<body>
<div class="header">
<h1>📰 外匯報告</h1>
<div class="sub">早晚盤市場分析報告</div>
</div>
<div class="reports-grid" id="reports-grid"></div>
<script>
// Auto-generate report cards from listing
const reports = [
'2026-05-23_morning.html','2026-05-23_evening.html',
'2026-05-24_morning.html','2026-05-24_evening.html',
'2026-05-25_morning.html','2026-05-25_evening.html',
'2026-05-26_morning.html','2026-05-26_evening.html',
'2026-05-28_morning.html','2026-05-28_evening.html',
'2026-05-29_morning.html','2026-05-29_evening.html','2026-05-29_daily.html',
'2026-05-30_morning.html',
'2026-06-01_morning.html','2026-06-01_evening.html',
'2026-06-02_morning.html'
];
const grid = document.getElementById('reports-grid');
const dates = {};
reports.forEach(r => {
  const [date, type] = r.replace('.html','').split('_');
  if(!dates[date]) dates[date] = {morning:false,evening:false,daily:false};
  dates[date][type] = true;
});
Object.keys(dates).sort().reverse().forEach(date => {
  const d = dates[date];
  const card = document.createElement('div');
  card.className = 'report-card';
  let links = '';
  if(d.morning) links += `<a href="${date}_morning.html" class="morning">🌅 早盤</a>`;
  if(d.evening) links += `<a href="${date}_evening.html" class="evening">🌆 晚盤</a>`;
  if(d.daily) links += `<a href="${date}_daily.html" class="daily">📊 日報</a>`;
  card.innerHTML = `<div class="date">${date}</div><div class="type">${d.morning&&d.evening?'完整報告':'部分報告'}</div><div class="report-links">${links}</div>`;
  grid.appendChild(card);
});
</script>
</body>
</html>
