<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; worker-src 'self' blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com;">
<title>🗄️ TSA 数据库浏览器</title>

<style>
:root {
  --primary: #0f3460;
  --accent: #e94560;
  --bg: #f5f7fa;
  --card: #fff;
  --text: #333;
  --text2: #666;
  --green: #28a745;
  --yellow: #ffc107;
  --orange: #fd7e14;
  --red: #dc3545;
  --radius: 12px;
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
.container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

/* Header */
.header { text-align: center; padding: 32px 20px 20px; background: linear-gradient(135deg, var(--primary) 0%, #16213e 100%); margin: -24px -16px 24px; padding-left: 36px; padding-right: 36px; }
.header h1 { color: #fff; font-size: 1.6em; display: flex; align-items: center; justify-content: center; gap: 10px; }
.header .sub { color: #a8d8ea; font-size: 0.85em; margin-top: 4px; }
.header a { color: #a8d8ea; text-decoration: none; font-size: 0.85em; }
.header a:hover { color: #fff; }

/* Cards */
.card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card h2 { font-size: 1.1em; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.card h2 .icon { font-size: 1.2em; }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat-item { text-align: center; padding: 12px; background: var(--bg); border-radius: 8px; }
.stat-item .value { font-size: 1.8em; font-weight: 700; color: var(--primary); }
.stat-item .label { font-size: 0.75em; color: var(--text2); margin-top: 2px; }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--text2); }
.loading .spinner { display: inline-block; width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
.tab { padding: 8px 16px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 0.85em; white-space: nowrap; transition: all 0.2s; background: #fff; }
.tab:hover { background: #f0f0f0; }
.tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Table */
.data-table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
.data-table th { background: var(--primary); color: #fff; padding: 8px 10px; text-align: left; font-weight: 600; white-space: nowrap; }
.data-table td { padding: 7px 10px; border-bottom: 1px solid #eee; }
.data-table tr:hover { background: #f8f9ff; }
.data-table .score { font-weight: 700; }
.data-table .score-high { color: var(--green); }
.data-table .score-mid { color: var(--orange); }
.data-table .score-low { color: var(--red); }
.data-table .red-card { background: #fff0f0; }

/* Search */
.search-box { display: flex; gap: 8px; margin-bottom: 16px; }
.search-box input { flex: 1; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em; outline: none; transition: border-color 0.2s; }
.search-box input:focus { border-color: var(--primary); }
.search-box button { padding: 10px 20px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9em; font-weight: 600; transition: background 0.2s; }
.search-box button:hover { background: #0a2540; }
.search-box select { padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em; outline: none; background: #fff; }

/* Error */
.error { color: var(--red); padding: 16px; background: #fff5f5; border-radius: 8px; border-left: 4px solid var(--red); }

/* SQL Console */
.sql-console textarea { width: 100%; min-height: 80px; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 0.85em; resize: vertical; outline: none; }
.sql-console textarea:focus { border-color: var(--primary); }
.sql-console .actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.sql-console .result { margin-top: 12px; overflow-x: auto; }
.sql-console .bytes-info { font-size: 0.8em; color: var(--text2); }

/* Pagination */
.pagination { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
.pagination button { padding: 6px 14px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; background: #fff; font-size: 0.85em; }
.pagination button:hover { background: #f0f0f0; }
.pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Back link */
.back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--primary); text-decoration: none; font-size: 0.9em; margin-bottom: 12px; }
.back-link:hover { text-decoration: underline; }

/* Responsive */
@media (max-width: 600px) {
  .header h1 { font-size: 1.3em; }
  .stat-item .value { font-size: 1.4em; }
  .data-table { font-size: 0.75em; }
  .data-table th, .data-table td { padding: 5px 6px; }
  .search-box { flex-direction: column; }
}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>🗄️ TSA 数据库浏览器</h1>
    <p class="sub">sql.js-httpvfs · 在浏览器中直接查询 SQLite 数据库</p>
    <a href="./index.html">← 返回主页</a>
  </div>

  <!-- Stats -->
  <div class="card" id="stats-card">
    <h2><span class="icon">📊</span> 数据库统计</h2>
    <div id="stats-content">
      <div class="loading"><div class="spinner"></div><p style="margin-top:12px">正在连接数据库...</p></div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="main-tabs">
    <div class="tab active" data-tab="ranking">🏆 信号排名</div>
    <div class="tab" data-tab="symbols">💱 货币对统计</div>
    <div class="tab" data-tab="redcard">🚫 Red Card</div>
    <div class="tab" data-tab="search">🔍 搜索</div>
    <div class="tab" data-tab="sql">💻 SQL 控制台</div>
  </div>

  <!-- Tab: Ranking -->
  <div class="card tab-content" id="tab-ranking">
    <h2><span class="icon">🏆</span> 信号排名</h2>
    <div class="search-box">
      <select id="ranking-symbol">
        <option value="">全部货币对</option>
      </select>
      <select id="ranking-version">
        <option value="v5">DDE v5</option>
        <option value="v4">DDE v4</option>
      </select>
      <select id="ranking-limit">
        <option value="20">Top 20</option>
        <option value="50">Top 50</option>
        <option value="100">Top 100</option>
      </select>
      <button onclick="loadRanking()">查询</button>
    </div>
    <div id="ranking-content">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Tab: Symbol Stats -->
  <div class="card tab-content" id="tab-symbols" style="display:none">
    <h2><span class="icon">💱</span> 货币对统计</h2>
    <div id="symbols-content">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Tab: Red Card -->
  <div class="card tab-content" id="tab-redcard" style="display:none">
    <h2><span class="icon">🚫</span> Red Card 信号</h2>
    <div id="redcard-content">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Tab: Search -->
  <div class="card tab-content" id="tab-search" style="display:none">
    <h2><span class="icon">🔍</span> 搜索信号</h2>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="输入 Signal ID、货币对或 EA 名称..." onkeypress="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">搜索</button>
    </div>
    <div id="search-content"></div>
  </div>

  <!-- Tab: SQL Console -->
  <div class="card tab-content" id="tab-sql" style="display:none">
    <h2><span class="icon">💻</span> SQL 查询控制台</h2>
    <div class="sql-console">
      <textarea id="sql-input" placeholder="输入 SQL 查询语句，例如：&#10;SELECT signal_id, symbol, dde_score FROM dde_scores ORDER BY dde_score DESC LIMIT 10">SELECT signal_id, symbol, dde_score, win_rate, profit_factor, trades FROM dde_scores WHERE strategy_version = 'v5' ORDER BY dde_score DESC LIMIT 20</textarea>
      <div class="actions">
        <button onclick="executeSql()">▶ 执行查询</button>
        <span class="bytes-info" id="sql-bytes"></span>
      </div>
      <div class="result" id="sql-result"></div>
    </div>
  </div>
</div>

<script src="./js/sql.js-httpvfs.js"></script>
<script>
const { createDbWorker } = sqlJsHttpvfs;
// 配置
const DB_URL = './data/tsa.db';
const WORKER_URL = './js/sqlite.worker.js';
const WASM_URL = './js/sql-wasm.wasm';

let worker = null;
let db = null;

// 初始化数据库
async function initDb() {
  try {
    const config = {
      from: "inline",
      config: {
        serverMode: "full",
        requestChunkSize: 4096,
        url: DB_URL
      }
    };

    worker = await createDbWorker([config], WORKER_URL, WASM_URL, 10 * 1024 * 1024);
    db = worker.db;
    console.log('[DB] 数据库初始化成功');
    
    // 加载统计信息
    await loadStats();
    // 加载排名
    await loadRanking();
    
    return worker;
  } catch (error) {
    console.error('[DB] 初始化失败:', error);
    document.getElementById('stats-content').innerHTML = `<div class="error">❌ 数据库连接失败: ${error.message}<br><br><small>请确认：<br>1. data/tsa.db 文件存在<br>2. 通过 HTTP 服务器访问（非 file://）<br>3. 服务器支持 Range 请求</small></div>`;
  }
}

// 查询辅助函数
async function query(sql, params = []) {
  if (!db) throw new Error('数据库未初始化');
  const result = await db.exec(sql, params);
  if (result.length === 0) return { columns: [], rows: [] };
  return { columns: result[0].columns, rows: result[0].values };
}

function toObjects(result) {
  return result.rows.map(row => {
    const obj = {};
    result.columns.forEach((col, i) => { obj[col] = row[i]; });
    return obj;
  });
}

function formatNumber(n, decimals = 1) {
  if (n === null || n === undefined) return '-';
  return Number(n).toFixed(decimals);
}

function scoreClass(score) {
  if (score >= 80) return 'score-high';
  if (score >= 50) return 'score-mid';
  return 'score-low';
}

// === 加载统计信息 ===
async function loadStats() {
  try {
    const result = await query(`
      SELECT 
        (SELECT COUNT(*) FROM dde_scores) as total_records,
        (SELECT COUNT(DISTINCT signal_id) FROM dde_scores) as unique_signals,
        (SELECT COUNT(DISTINCT symbol) FROM dde_scores) as unique_symbols,
        (SELECT COUNT(*) FROM batch_runs) as total_batches,
        (SELECT MAX(analysis_date) FROM dde_scores) as last_analysis
    `);
    
    const stats = toObjects(result)[0];
    
    // 获取符号列表
    const symbols = await query('SELECT DISTINCT symbol FROM dde_scores ORDER BY symbol');
    const symbolSelect = document.getElementById('ranking-symbol');
    symbols.rows.forEach(row => {
      const opt = document.createElement('option');
      opt.value = row[0];
      opt.textContent = row[0];
      symbolSelect.appendChild(opt);
    });
    
    document.getElementById('stats-content').innerHTML = `
      <div class="stats-grid">
        <div class="stat-item">
          <div class="value">${stats.total_records || 0}</div>
          <div class="label">总记录数</div>
        </div>
        <div class="stat-item">
          <div class="value">${stats.unique_signals || 0}</div>
          <div class="label">唯一信号</div>
        </div>
        <div class="stat-item">
          <div class="value">${stats.unique_symbols || 0}</div>
          <div class="label">货币对</div>
        </div>
        <div class="stat-item">
          <div class="value">${stats.total_batches || 0}</div>
          <div class="label">批次运行</div>
        </div>
        <div class="stat-item">
          <div class="value" style="font-size:0.9em">${stats.last_analysis || '-'}</div>
          <div class="label">最后分析日期</div>
        </div>
      </div>
    `;
  } catch (e) {
    document.getElementById('stats-content').innerHTML = `<div class="error">加载统计失败: ${e.message}</div>`;
  }
}

// === 加载排名 ===
window.loadRanking = async function() {
  const symbol = document.getElementById('ranking-symbol').value;
  const version = document.getElementById('ranking-version').value;
  const limit = parseInt(document.getElementById('ranking-limit').value);
  
  document.getElementById('ranking-content').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  
  try {
    let sql = `
      SELECT signal_id, symbol, dde_score, win_rate, profit_factor, trades, 
             total_net_pips, max_dd_pips, red_card, ea, lv
      FROM dde_scores
      WHERE strategy_version = ?
    `;
    const params = [version];
    
    if (symbol) {
      sql += ' AND symbol = ?';
      params.push(symbol);
    }
    
    sql += ' ORDER BY dde_score DESC LIMIT ?';
    params.push(limit);
    
    const result = await query(sql, params);
    const data = toObjects(result);
    
    let html = `<table class="data-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Signal</th>
          <th>Symbol</th>
          <th>DDE Score</th>
          <th>Win Rate</th>
          <th>PF</th>
          <th>Trades</th>
          <th>Net Pips</th>
          <th>Max DD</th>
          <th>EA</th>
          <th>LV</th>
        </tr>
      </thead>
      <tbody>`;
    
    data.forEach((row, i) => {
      const rc = row.red_card ? ' class="red-card"' : '';
      html += `<tr${rc}>
        <td>${i + 1}</td>
        <td><strong>${row.signal_id}</strong></td>
        <td>${row.symbol}</td>
        <td class="score ${scoreClass(row.dde_score)}">${formatNumber(row.dde_score)}</td>
        <td>${formatNumber(row.win_rate)}%</td>
        <td>${formatNumber(row.profit_factor, 2)}</td>
        <td>${row.trades}</td>
        <td>${formatNumber(row.total_net_pips, 0)}</td>
        <td>${formatNumber(row.max_dd_pips, 0)}</td>
        <td>${row.ea || '-'}</td>
        <td>${row.lv || '-'}</td>
      </tr>`;
    });
    
    html += '</tbody></table>';
    
    if (data.length === 0) {
      html = '<p style="text-align:center;color:#999;padding:20px">没有找到数据</p>';
    }
    
    document.getElementById('ranking-content').innerHTML = html;
  } catch (e) {
    document.getElementById('ranking-content').innerHTML = `<div class="error">查询失败: ${e.message}</div>`;
  }
};

// === 货币对统计 ===
async function loadSymbols() {
  try {
    const result = await query(`
      SELECT symbol, COUNT(*) as cnt, AVG(dde_score) as avg_score, 
             MAX(dde_score) as max_score, AVG(win_rate) as avg_wr, AVG(profit_factor) as avg_pf
      FROM dde_scores WHERE strategy_version = 'v5'
      GROUP BY symbol ORDER BY avg_score DESC
    `);
    const data = toObjects(result);
    
    let html = `<table class="data-table">
      <thead>
        <tr><th>#</th><th>Symbol</th><th>Signals</th><th>Avg Score</th><th>Max Score</th><th>Avg WR</th><th>Avg PF</th></tr>
      </thead><tbody>`;
    
    data.forEach((row, i) => {
      html += `<tr>
        <td>${i + 1}</td>
        <td><strong>${row.symbol}</strong></td>
        <td>${row.cnt}</td>
        <td class="score ${scoreClass(row.avg_score)}">${formatNumber(row.avg_score)}</td>
        <td class="score ${scoreClass(row.max_score)}">${formatNumber(row.max_score)}</td>
        <td>${formatNumber(row.avg_wr)}%</td>
        <td>${formatNumber(row.avg_pf, 2)}</td>
      </tr>`;
    });
    
    html += '</tbody></table>';
    document.getElementById('symbols-content').innerHTML = html;
  } catch (e) {
    document.getElementById('symbols-content').innerHTML = `<div class="error">加载失败: ${e.message}</div>`;
  }
}

// === Red Card ===
async function loadRedCards() {
  try {
    const result = await query(`
      SELECT signal_id, symbol, dde_score, red_reasons, ea, lv
      FROM dde_scores WHERE red_card = 1 ORDER BY dde_score DESC LIMIT 100
    `);
    const data = toObjects(result);
    
    let html = `<table class="data-table">
      <thead>
        <tr><th>#</th><th>Signal</th><th>Symbol</th><th>DDE Score</th><th>Red Card 原因</th><th>EA</th><th>LV</th></tr>
      </thead><tbody>`;
    
    data.forEach((row, i) => {
      html += `<tr class="red-card">
        <td>${i + 1}</td>
        <td><strong>${row.signal_id}</strong></td>
        <td>${row.symbol}</td>
        <td class="score">${formatNumber(row.dde_score)}</td>
        <td style="font-size:0.8em">${row.red_reasons || '-'}</td>
        <td>${row.ea || '-'}</td>
        <td>${row.lv || '-'}</td>
      </tr>`;
    });
    
    html += '</tbody></table>';
    
    if (data.length === 0) {
      html = '<p style="text-align:center;color:#999;padding:20px">✅ 没有 Red Card 信号</p>';
    }
    
    document.getElementById('redcard-content').innerHTML = html;
  } catch (e) {
    document.getElementById('redcard-content').innerHTML = `<div class="error">加载失败: ${e.message}</div>`;
  }
}

// === 搜索 ===
window.doSearch = async function() {
  const keyword = document.getElementById('search-input').value.trim();
  if (!keyword) return;
  
  document.getElementById('search-content').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  
  try {
    const pattern = `%${keyword}%`;
    const result = await query(`
      SELECT signal_id, symbol, dde_score, win_rate, profit_factor, trades, ea, lv
      FROM dde_scores
      WHERE strategy_version = 'v5'
      AND (signal_id LIKE ? OR symbol LIKE ? OR ea LIKE ?)
      ORDER BY dde_score DESC LIMIT 50
    `, [pattern, pattern, pattern]);
    
    const data = toObjects(result);
    
    let html = `<p style="margin-bottom:12px;color:#666">找到 ${data.length} 条结果</p>`;
    
    if (data.length > 0) {
      html += `<table class="data-table">
        <thead>
          <tr><th>Signal</th><th>Symbol</th><th>DDE Score</th><th>Win Rate</th><th>PF</th><th>Trades</th><th>EA</th></tr>
        </thead><tbody>`;
      
      data.forEach(row => {
        html += `<tr>
          <td><strong>${row.signal_id}</strong></td>
          <td>${row.symbol}</td>
          <td class="score ${scoreClass(row.dde_score)}">${formatNumber(row.dde_score)}</td>
          <td>${formatNumber(row.win_rate)}%</td>
          <td>${formatNumber(row.profit_factor, 2)}</td>
          <td>${row.trades}</td>
          <td>${row.ea || '-'}</td>
        </tr>`;
      });
      
      html += '</tbody></table>';
    }
    
    document.getElementById('search-content').innerHTML = html;
  } catch (e) {
    document.getElementById('search-content').innerHTML = `<div class="error">搜索失败: ${e.message}</div>`;
  }
};

// === SQL Console ===
window.executeSql = async function() {
  const sql = document.getElementById('sql-input').value.trim();
  if (!sql) return;
  
  const resultDiv = document.getElementById('sql-result');
  resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  
  try {
    const bytesBefore = worker ? await worker.worker.bytesRead : 0;
    
    const result = await query(sql);
    
    const bytesAfter = worker ? await worker.worker.bytesRead : 0;
    const bytesUsed = bytesAfter - bytesBefore;
    
    document.getElementById('sql-bytes').textContent = `传输: ${(bytesUsed / 1024).toFixed(1)} KB | 总计: ${(bytesAfter / 1024).toFixed(1)} KB`;
    
    if (result.rows.length === 0) {
      resultDiv.innerHTML = '<p style="color:#999;padding:12px">查询返回空结果</p>';
      return;
    }
    
    let html = `<p style="margin-bottom:8px;color:#666;font-size:0.85em">${result.rows.length} 行</p>`;
    html += '<div style="overflow-x:auto"><table class="data-table"><thead><tr>';
    
    result.columns.forEach(col => {
      html += `<th>${col}</th>`;
    });
    
    html += '</tr></thead><tbody>';
    
    result.rows.forEach(row => {
      html += '<tr>';
      row.forEach(cell => {
        const val = cell === null ? '<em style="color:#999">NULL</em>' : cell;
        html += `<td>${val}</td>`;
      });
      html += '</tr>';
    });
    
    html += '</tbody></table></div>';
    
    resultDiv.innerHTML = html;
  } catch (e) {
    resultDiv.innerHTML = `<div class="error">查询失败: ${e.message}</div>`;
  }
};

// === Tab 切换 ===
const tabs = document.querySelectorAll('.tab');
const tabContents = {
  'ranking': document.getElementById('tab-ranking'),
  'symbols': document.getElementById('tab-symbols'),
  'redcard': document.getElementById('tab-redcard'),
  'search': document.getElementById('tab-search'),
  'sql': document.getElementById('tab-sql')
};

let loadedTabs = new Set(['ranking']);

tabs.forEach(tab => {
  tab.addEventListener('click', async () => {
    const target = tab.dataset.tab;
    
    // Update active tab
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    
    // Show/hide content
    Object.values(tabContents).forEach(c => c.style.display = 'none');
    tabContents[target].style.display = 'block';
    
    // Lazy load
    if (!loadedTabs.has(target)) {
      loadedTabs.add(target);
      if (target === 'symbols') await loadSymbols();
      if (target === 'redcard') await loadRedCards();
    }
  });
});

// 初始化
initDb();
</script>
