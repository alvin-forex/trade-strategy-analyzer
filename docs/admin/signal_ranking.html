        <style>

                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #2a3650;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #161e2e;
                border: 1px solid #2a3650;
                border-radius: 6px;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 8px 32px 0 rgba(5, 9, 16, 0.55);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                color: #e6edf5;
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px;
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #1c2638;
                border: 1px solid #2a3650;
                border-radius: 6px;
                width: 100%;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-password-container:focus-within {
                outline: 2px solid #5ca8ff;
                outline-offset: -1px;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                filter: invert(0.85);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #5ca8ff;
                width: 100%;
                border: 0;
                border-radius: 6px;
                padding: 15px;
                color: #0f1520;
                font-weight: 700;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #5ca8ff;
                filter: brightness(0.92);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #0f1520;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    "PingFang TC", "Noto Sans HK", "Microsoft JhengHei", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
                color: #a8b4c4;
            }

            .staticrypt-title {
                font-size: 1.5em;
                color: #e6edf5;
                font-weight: 700;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
                color: #a8b4c4;
                justify-content: center;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
                accent-color: #5ca8ff;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid #2a3650;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .staticrypt-spinner {
                    -webkit-animation: none;
                    animation: none;
                }
            }
        </style>
