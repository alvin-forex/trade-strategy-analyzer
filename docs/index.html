<!DOCTYPE html>
<html lang="zh-HK" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦀 TSA - Trade Strategy Analyzer</title>
<style>
:root{--bg:#0d1117;--bg-card:#161b22;--bg-hover:#1c2128;--text:#e6edf3;--text2:#8b949e;--primary:#58a6ff;--accent:#79c0ff;--border:#30363d;--green:#3fb950;--yellow:#d29922;--red:#f85149;--radius:12px}
[data-theme="light"]{--bg:#fff;--bg-card:#f6f8fa;--bg-hover:#eaeef2;--text:#1f2328;--text2:#656d76;--primary:#0969da;--accent:#0550ae;--border:#d0d7de}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.topnav{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg-card);border-bottom:1px solid var(--border);margin-bottom:16px;position:sticky;top:0;z-index:100}
.topnav-logo{font-weight:700;font-size:1em;color:var(--primary);text-decoration:none;margin-right:auto}
.topnav-links{display:flex;gap:10px;flex-wrap:wrap}
.topnav-link{color:var(--text2);text-decoration:none;font-size:.88em;font-weight:600;padding:4px 10px;border-radius:6px;transition:all .2s}
.topnav-link:hover{color:var(--primary);background:var(--bg-hover)}
.topnav-link.active{color:var(--primary);background:var(--bg-hover)}
.theme-btn{background:none;border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:14px}
.container{max-width:800px;margin:0 auto;padding:24px 16px}
.hero{text-align:center;padding:60px 20px 40px}
.hero h1{font-size:2em;margin-bottom:8px}
.hero p{color:var(--text2);font-size:1.1em;margin-bottom:32px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:24px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-decoration:none;color:var(--text);transition:all .2s;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.card-icon{font-size:2em}
.card h2{font-size:1.1em;color:var(--primary)}
.card p{font-size:.88em;color:var(--text2);line-height:1.5}
</style>
</head>
<body>
<div class="topnav">
  <a href="./index.html" class="topnav-logo">🦀 TSA</a>
  <div class="topnav-links">
    <a href="./index.html" class="topnav-link active">🏠 首頁</a>
    <a href="./signal_ranking_dde_v4.html" class="topnav-link">🏆 Signal 排名</a>
    <a href="./reports/ranking_ccy.html" class="topnav-link">💱 CCY 排名</a>
    <a href="./ccy_timeframe_volatility.html" class="topnav-link">📊 波幅表</a>
  </div>
  <button class="theme-btn" id="theme-toggle" onclick="toggleTheme()">🌙</button>
</div>

<div class="container">
<div class="hero">
  <h1>🦀 Trade Strategy Analyzer</h1>
  <p>交易策略分析系統 · DDE v4 多維度評分 · Lot-Based 層級偵測</p>
</div>

<div class="cards">
  <a href="./signal_ranking_dde_v4.html" class="card">
    <span class="card-icon">🏆</span>
    <h2>Signal 排名</h2>
    <p>57 個信號按 DDE v4 五維評分排名，含勝率、馬丁層級、風險回報比</p>
  </a>
  <a href="./reports/ranking_ccy.html" class="card">
    <span class="card-icon">💱</span>
    <h2>CCY 排名</h2>
    <p>按貨幣對維度的排名分析，866 個 Signal×CCY 組合</p>
  </a>
  <a href="./ccy_timeframe_volatility.html" class="card">
    <span class="card-icon">📊</span>
    <h2>波幅表</h2>
    <p>各貨幣對在不同時間框架的波幅統計</p>
  </a>
  <a href="./dashboard.html" class="card">
    <span class="card-icon">🔬</span>
    <h2>分析工具</h2>
    <p>上傳 CSV + SET 檔案，即時生成完整策略分析報告</p>
  </a>
</div>
</div>

<script>function toggleTheme(){var t=document.documentElement.getAttribute("data-theme");var n=t==="light"?"dark":"light";document.documentElement.setAttribute("data-theme",n);localStorage.setItem("tsa-theme",n);var b=document.getElementById("theme-toggle");b.textContent=n==="dark"?"🌙":"☀️"}(function(){var s=localStorage.getItem("tsa-theme")||"dark";document.documentElement.setAttribute("data-theme",s);var b=document.getElementById("theme-toggle");if(b)b.textContent=s==="dark"?"🌙":"☀️"})();</script>
</body>
</html>
