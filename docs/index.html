<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🦀 TSA — Trade Strategy Analyzer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e17;--bg2:#0f1320;--card:#111520;--card-h:#161b2d;
  --border:#1e2433;--border2:#2a3040;
  --text:#e0e0e0;--text2:#8892a6;--text3:#5a6478;
  --pri:#FFD700;--acc:#64b5f6;--acc-dim:rgba(100,181,246,.12);
  --green:#4CAF50;--red:#FF5252;--yellow:#FFC107;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;
  --sidebar-w:250px;--sidebar-w-collapsed:58px;--header-h:0px;
}
[data-theme="light"]{
  --bg:#f0f2f5;--bg2:#e4e7ec;--card:#ffffff;--card-h:#f0f2f5;
  --border:#c4c9d0;--border2:#a8afb8;
  --text:#0d1117;--text2:#3d4452;--text3:#6b7280;
  --pri:#1a3a6b;--acc:#c81e4a;--acc-dim:rgba(200,30,74,.1);
  --green:#1a7d32;--red:#c41e3a;--yellow:#8a6d00;
}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text)}
a{color:var(--acc);text-decoration:none}

/* === LAYOUT === */
.app{display:flex;height:100vh;width:100%}

/* === SIDEBAR === */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;
  transition:width .2s ease;z-index:100;
}
.sidebar.collapsed{width:var(--sidebar-w-collapsed)}
.sidebar.collapsed .nav-text,.sidebar.collapsed .nav-section,.sidebar.collapsed .pin-label{display:none!important}
.sidebar.collapsed .nav-link{text-align:center;padding:12px 4px}
.sidebar.collapsed .nav-ico{margin-right:0}

/* Sidebar header */
.sb-header{padding:16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sb-header .logo{font-size:20px}
.sb-header .title{font-size:14px;font-weight:800;color:var(--pri);white-space:nowrap}
.sb-header .sub{font-size:10px;color:var(--text2);white-space:nowrap}

/* Pin toggle */
.pin-btn{
  margin-left:auto;background:var(--bg2);border:1px solid var(--border);color:var(--text2);
  border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;
}
.pin-btn:hover{background:var(--card-h);color:var(--text)}
.sidebar.collapsed .pin-btn{margin:0 auto 4px}

/* Nav sections */
.nav-section-title{
  padding:12px 14px 4px;font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:1px;white-space:nowrap;
}
.nav-link{
  display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--text2);
  font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;
  border-left:3px solid transparent;
}
.nav-link:hover{background:var(--bg2);color:var(--text)}
.nav-link.active{background:var(--acc-dim);color:var(--acc);border-left-color:var(--acc)}
.nav-ico{font-size:15px;width:20px;text-align:center;flex-shrink:0}

/* Sidebar footer */
.sb-footer{margin-top:auto;padding:10px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sb-tool{
  display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--border);
  border-radius:8px;background:var(--bg2);color:var(--text2);font-size:12px;cursor:pointer;width:100%;
}
.sb-tool:hover{background:var(--card-h);color:var(--text)}
.sidebar.collapsed .sb-tool{justify-content:center;padding:8px 4px}

/* === MOBILE === */
.mobile-toggle{display:none;position:fixed;top:10px;left:10px;z-index:200;
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  width:40px;height:40px;font-size:18px;cursor:pointer;color:var(--text)}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}

@media(max-width:768px){
  .mobile-toggle{display:flex;align-items:center;justify-content:center}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);
    width:var(--sidebar-w);box-shadow:4px 0 24px rgba(0,0,0,.4);
  }
  .sidebar.mobile-open{transform:translateX(0)}
  .sidebar.collapsed{width:var(--sidebar-w)}
  .sidebar.collapsed .nav-text,.sidebar.collapsed .nav-section,.sidebar.collapsed .pin-label{display:block!important}
  .backdrop.show{display:block}
}

/* === CONTENT FRAME === */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content-frame{flex:1;border:none;width:100%;background:var(--bg)}
.loading{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--text2);font-size:14px;
}
</style>
</head>
<body>

<button class="mobile-toggle" onclick="toggleMobile()">☰</button>
<div class="backdrop" id="backdrop" onclick="toggleMobile()"></div>

<div class="app">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sb-header">
      <span class="logo">🦀</span>
      <div>
        <div class="title">TSA</div>
        <div class="sub">Trade Strategy Analyzer</div>
      </div>
      <button class="pin-btn" id="pinBtn" onclick="togglePin()" title="固定/收起">📌</button>
    </div>

    <div class="nav-section-title">📊 分析</div>
    <div class="nav-link active" data-url="admin/index.html" onclick="navClick(this)"><span class="nav-ico">🏠</span><span class="nav-text">首頁</span></div>
    <div class="nav-link" data-url="admin/signal_ranking.html" onclick="navClick(this)"><span class="nav-ico">🏆</span><span class="nav-text">Signal 排名</span></div>
    <div class="nav-link" data-url="admin/ccy_ranking.html" onclick="navClick(this)"><span class="nav-ico">💱</span><span class="nav-text">CCY 排名</span></div>
    <div class="nav-link" data-url="admin/volatility.html" onclick="navClick(this)"><span class="nav-ico">📊</span><span class="nav-text">波幅表</span></div>
    <div class="nav-link" data-url="admin/portfolios/portfolio_master_report_v2.html" onclick="navClick(this)"><span class="nav-ico">💼</span><span class="nav-text">Portfolio</span></div>
    <div class="nav-link" data-url="admin/reviews/" onclick="navClick(this)"><span class="nav-ico">📅</span><span class="nav-text">覆盤報告</span></div>

    <div class="nav-section-title">⚡ 即時</div>
    <div class="nav-link" data-url="admin/ccy_power/index.html" onclick="navClick(this)"><span class="nav-ico">⚡</span><span class="nav-text">CCY Power</span></div>
    <div class="nav-link" data-url="admin/forex_hub/index.html" onclick="navClick(this)"><span class="nav-ico">🦀</span><span class="nav-text">4H 市場分析</span></div>
    <div class="nav-link" data-url="admin/forex_news.html" onclick="navClick(this)"><span class="nav-ico">📰</span><span class="nav-text">外匯新聞</span></div>

    <div class="nav-section-title">🧮 工具</div>
    <div class="nav-link" data-url="tug_of_war_calculator.html" onclick="navClick(this)"><span class="nav-ico">⚔️</span><span class="nav-text">拔河計算機</span></div>
    <div class="nav-link" data-url="reports/sample_redesign_36912.html" onclick="navClick(this)"><span class="nav-ico">🎨</span><span class="nav-text">v2 樣板</span></div>

    <!-- Reports dropdown -->
    <div class="nav-section-title">📄 報告</div>
    <div class="nav-link" data-url="reports/index_36912.html" onclick="navClick(this)"><span class="nav-ico">📊</span><span class="nav-text">Signal 36912</span></div>
    <div class="nav-link" data-url="reports/martin_v4_36912.html" onclick="navClick(this)"><span class="nav-ico">🔍</span><span class="nav-text">Martin 36912</span></div>
    <div class="nav-link" data-url="reports/index_42541.html" onclick="navClick(this)"><span class="nav-ico">📊</span><span class="nav-text">Signal 42541</span></div>
    <div class="nav-link" data-url="reports/martin_v4_42541.html" onclick="navClick(this)"><span class="nav-ico">🔍</span><span class="nav-text">Martin 42541</span></div>
    <div class="nav-link" data-url="reports/index_44780.html" onclick="navClick(this)"><span class="nav-ico">📊</span><span class="nav-text">Signal 44780</span></div>
    <div class="nav-link" data-url="reports/martin_v4_44780.html" onclick="navClick(this)"><span class="nav-ico">🔍</span><span class="nav-text">Martin 44780</span></div>

    <div class="sb-footer">
      <button class="sb-tool" onclick="toggleTheme()" id="themeBtn"><span id="themeIco">🌙</span> <span class="nav-text">切換主題</span></button>
      <button class="sb-tool" onclick="openInNew()"><span>🔗</span> <span class="nav-text">新分頁打開</span></button>
    </div>
  </nav>

  <!-- CONTENT -->
  <main class="content">
    <iframe class="content-frame" id="contentFrame" src="admin/index.html"></iframe>
  </main>
</div>

<script>
// === Navigation ===
function navClick(el){
  document.querySelectorAll('.nav-link').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  var url=el.dataset.url;
  document.getElementById('contentFrame').src=url;
  // Close mobile sidebar
  if(window.innerWidth<=768) toggleMobile(false);
  // Update URL hash
  history.replaceState(null,'','#'+url);
}

// === Pin / Collapse ===
function togglePin(){
  var sb=document.getElementById('sidebar');
  sb.classList.toggle('collapsed');
  localStorage.setItem('tsa-sidebar-collapsed',sb.classList.contains('collapsed'));
}
// Restore pin state
if(localStorage.getItem('tsa-sidebar-collapsed')==='true'){
  document.getElementById('sidebar').classList.add('collapsed');
}

// === Mobile ===
function toggleMobile(force){
  var sb=document.getElementById('sidebar');
  var bd=document.getElementById('backdrop');
  if(force===false){sb.classList.remove('mobile-open');bd.classList.remove('show');return;}
  sb.classList.toggle('mobile-open');
  bd.classList.toggle('show');
}

// === Theme ===
function toggleTheme(){
  var html=document.documentElement;
  var cur=html.getAttribute('data-theme')||'dark';
  var next=cur==='dark'?'light':'dark';
  html.setAttribute('data-theme',next);
  localStorage.setItem('tsa-theme',next);
  document.getElementById('themeIco').textContent=next==='dark'?'🌙':'☀️';
  // Also set theme inside iframe
  try{
    var frame=document.getElementById('contentFrame');
    if(frame.contentDocument){
      frame.contentDocument.documentElement.setAttribute('data-theme',next);
    }
  }catch(e){}
}
// Restore theme
(function(){
  var saved=localStorage.getItem('tsa-theme')||'dark';
  document.documentElement.setAttribute('data-theme',saved);
  document.getElementById('themeIco').textContent=saved==='dark'?'🌙':'☀️';
})();

// === Open in new tab ===
function openInNew(){
  var src=document.getElementById('contentFrame').src;
  window.open(src,'_blank');
}

// === Restore from URL hash ===
(function(){
  var hash=location.hash.replace('#','');
  if(hash){
    var link=document.querySelector('[data-url="'+hash+'"]');
    if(link){navClick(link);}
  }
})();

// === Sync theme to iframe on load ===
document.getElementById('contentFrame').addEventListener('load',function(){
  try{
    var theme=document.documentElement.getAttribute('data-theme')||'dark';
    this.contentDocument.documentElement.setAttribute('data-theme',theme);
  }catch(e){}
});
</script>
</body>
</html>
