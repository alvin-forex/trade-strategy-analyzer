<!DOCTYPE html>
<!-- 2026-11-05 老闆首頁意見（W7b）：唔需要入 admin 層——由 docs/admin/projection.html 移 root 公開明文層；同時補 EA 欄（projection.json ea）。 -->
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGNAL 排名表</title>
<style>
:root{--bg:#0f1620;--card:#16202e;--t1:#e8eef5;--t2:#a8b4c4;--t3:#7a8698;--line:#22303f;--amber:#c98a00;--red:#dc3545;--green:#28a745}
body{background:var(--bg);color:var(--t1);font-family:'Helvetica Neue','PingFang TC','Noto Sans CJK TC',sans-serif;margin:0;padding:24px 16px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}
.meta{color:var(--t2);font-size:12.5px;line-height:1.6;margin-bottom:10px}
.badge{display:inline-block;padding:2px 10px;border-radius:6px;font-size:12px;margin-left:8px;vertical-align:middle}
.badge.na{background:#3a3f46;color:var(--t2)}
.lamp{display:inline-block;width:9px;height:9px;border-radius:50%;background:#666;margin-right:6px;vertical-align:middle}
.lamp.off{background:#555f6b}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.fbar input[type=search],.fbar select{background:#1c2937;color:var(--t1);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px}
.fbar input[type=search]{flex:1 1 180px;min-width:150px}
.fbar select{max-width:150px}
#cnt{color:var(--t2);font-size:12.5px;flex-basis:100%}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:10px;overflow:hidden}
th{position:sticky;top:0;background:#1c2937;color:var(--t2);text-align:left;padding:8px 10px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--t1)}
th .arr{display:inline-block;width:1em;color:var(--amber)}
td{padding:7px 10px;border-bottom:1px solid #1b2634;white-space:nowrap}
tr:hover td{background:#1a2735}
td.num{text-align:right;font-variant-numeric:tabular-nums}
a.sig{color:#4a9eda;text-decoration:none;border-bottom:1px dotted #4a9eda}
a.sig:hover{color:#7cc3f0}
.red{color:var(--red);font-weight:700}
.grn{color:var(--green)}
.amb{color:var(--amber)}
.r0{opacity:.92}.bar{height:3px;background:#2b3a4c;border-radius:2px;margin-top:3px}.bar>i{display:block;height:3px;border-radius:2px;background:linear-gradient(90deg,#2e6da4,#4a9eda)}
.foot{color:var(--t3);font-size:12px;margin-top:18px;text-align:center}
#err{color:var(--red);padding:20px}
@media(max-width:640px){body{padding:12px 6px}td,th{padding:6px 6px;font-size:12px}.fbar select{max-width:46%}}

/* ==== NAV BAR 方案 C（2026-11-04 P3，ZCODE；沿用首頁）==== */
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:stretch;height:48px;background:#161E2E;border-bottom:1px solid #2A3650;padding:0 16px;overflow-x:auto;overflow-y:hidden}
.nav a{display:inline-flex;align-items:center;padding:0 12px;color:#A8B4C4;font-size:14px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;text-decoration:none}
.nav a:hover{color:#E6EDF5}
.nav a[aria-current="page"]{color:#5CA8FF;font-weight:700;border-bottom-color:#5CA8FF}
.navdrawer{position:fixed;inset:0;z-index:220;background:rgba(10,14,20,.88);display:flex;flex-direction:column;align-items:stretch;justify-content:center;padding:32px}
.navdrawer[hidden]{display:none}
.navdrawer nav{display:flex;flex-direction:column;gap:8px;max-width:420px;margin:0 auto;width:100%}
.navdrawer a{display:flex;align-items:center;height:56px;padding:0 16px;background:#161E2E;border:1px solid #2A3650;border-radius:6px;color:#E6EDF5;font-size:16px;font-weight:500;text-decoration:none}
.navdrawer a[aria-current="page"]{color:#5CA8FF;font-weight:700;border-color:#5CA8FF}
.navdrawer-x{position:absolute;top:16px;right:16px;width:44px;height:44px;border:1px solid #2A3650;border-radius:6px;background:#161E2E;color:#E6EDF5;font-size:18px;cursor:pointer}
.burger{display:none}
@media(max-width:640px){
 .nav{display:none}
 .burger{display:block;position:fixed;top:8px;right:10px;z-index:60;width:40px;height:40px;border:1px solid #2A3650;border-radius:8px;background:#161E2E;color:#E6EDF5;font-size:18px;cursor:pointer}
}

/* ==== 橫向溢出修（2026-11-04 P3 順手）====
   手機≤640：table 內滾（x-overflow 歸零；sticky th 喺 scroll container 內犧牲——手機表格慣例）
   平板 641-1023：th/td 斷行收窄（768px 實測溢出 61-76px 源於 th/td nowrap；sticky 保留）
   ≥1024：不變（1280 實測零溢出）==== */
@media(max-width:640px){table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}}
@media(min-width:641px) and (max-width:1023px){th,td{white-space:normal}}
/* P3 順帶發現（P1 既有）：th sticky 失效真兇＝table{overflow:hidden}（圓角裁切）建立 clip 容器；
   ≥641 用 overflow:clip 同樣裁圓角但唔建立 scroll container，sticky 恢復相對視口；
   ≤640 保持 overflow-x:auto（table 內滾優先，sticky 喺 scroll container 內犧牲——手機表格慣例） */
@media(min-width:641px){table{overflow:clip}}
</style></head><body><nav class="nav" aria-label="主導航"><a href="index.html">首頁</a><a href="signal_ranking.html">排名</a><a href="forex_news.html">新聞</a><a href="ccy_power/index.html">CCY</a><a href="admin/tasks_board.html">任務板</a><a href="tug_of_war_calculator.html">工具</a></nav><div id="navDrawer" class="navdrawer" hidden role="dialog" aria-modal="true" aria-label="導航選單"><button id="navDrawerClose" class="navdrawer-x" aria-label="關閉導航">✕</button><nav aria-label="主導清單（手機）"><a href="index.html">首頁</a><a href="signal_ranking.html">排名</a><a href="forex_news.html">新聞</a><a href="ccy_power/index.html">CCY</a><a href="admin/tasks_board.html">任務板</a><a href="tug_of_war_calculator.html">工具</a></nav></div><button id="burgerBtn" class="burger" aria-label="開啟導航" aria-expanded="false">☰</button><div class="wrap">
<h1>📊 SIGNAL 排名表<span class="badge na" id="acctBadge"><span class="lamp off"></span>MT5 帳戶…</span></h1>
<div class="meta" id="meta">載入中…</div>
<div id="err"></div>
<div class="fbar">
<input type="search" id="fq" placeholder="搜尋 signal / 商品…" aria-label="搜尋 signal 或商品">
<select id="fs" aria-label="商品篩選"><option value="">商品：全部</option></select>
<select id="fm" aria-label="月份篩選"><option value="">月份：全部</option></select>
<select id="fr" aria-label="紅卡篩選">
<option value="">紅卡：全部</option>
<option value="only">只顯示紅卡</option>
<option value="hide">隱藏紅卡</option>
</select>
<span id="cnt"></span>
</div>
<table><thead><tr>
<th>#</th>
<th class="sortable" data-k="signal">信號 <span class="arr"></span></th>
<th class="sortable" data-k="symbol">商品 <span class="arr"></span></th>
<th class="sortable" data-k="ea">EA <span class="arr"></span></th>
<th class="sortable" data-k="dde_score">總分 dde_score <span class="arr"></span></th>
<th class="sortable" data-k="trades">樣本 trades <span class="arr"></span></th>
<th class="sortable" data-k="win_rate">勝率% <span class="arr"></span></th>
<th class="sortable" data-k="pf">PF <span class="arr"></span></th>
<th class="sortable" data-k="red_card">爆倉 red_card <span class="arr"></span></th>
<th class="sortable" data-k="month_growth">當月增長 <span class="arr"></span></th>
<th class="sortable" data-k="month_key">月份 <span class="arr"></span></th>
</tr></thead><tbody id="tb"></tbody></table>
<div class="foot" id="foot"></div>
</div>
<script>
let ROWS=[], state={k:'month_growth', dir:-1};   /* 預設維持現狀：當月增長 ↓ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function val(r,k){
  if(k==='red_card') return r.red_card?r.red_reasons.length:0;
  return r[k];
}
function isNul(v){ return v===null||v===undefined||(typeof v==='number'&&isNaN(v)); }
function cmp(a,b,k){
  let x=val(a,k), y=val(b,k);
  const an=isNul(x), bn=isNul(y);
  if(an&&bn) return 0;
  if(an) return 1;              /* null 沉底；isNul 唔做字串 coercion（isNaN('EURUSD') 係 true 會誤殺字串欄） */
  if(bn) return -1;
  if(typeof x==='string'||typeof y==='string') return String(x).localeCompare(String(y));
  return x<y?-1:(x>y?1:0);
}
function render(){
  const q=$('fq').value.trim().toLowerCase(), fs=$('fs').value, fm=$('fm').value, fr=$('fr').value;
  let view=ROWS.filter(r=>{
    if(q && !(String(r.signal).toLowerCase().includes(q)||String(r.symbol).toLowerCase().includes(q))) return false;
    if(fs && r.symbol!==fs) return false;
    if(fm && (r.month_key||'')!==fm) return false;
    if(fr==='only' && !r.red_card) return false;
    if(fr==='hide' && r.red_card) return false;
    return true;
  });
  /* null 沉底喺方向乘法之外（partition 法，退修 2026-11-04）：
     dir*cmp 喺 desc 時會反轉 null 分支（+1 變 −1）令 null 置頂，故先分離 null 再排非 null */
  const nn=view.filter(r=>!isNul(val(r,state.k)));
  const nu=view.filter(r=> isNul(val(r,state.k)));
  nn.sort((a,b)=>state.dir*cmp(a,b,state.k));
  view=nn.concat(nu);
  const maxg=Math.max(...ROWS.map(r=>r.month_growth||0),1);
  $('tb').innerHTML=view.map((r,i)=>{
    const mg=r.month_growth===null?'—':(r.month_growth>0?'+':'')+r.month_growth.toFixed(0);
    const mgc=r.month_growth===null?'':(r.month_growth>0?'grn':'red');
    const bar=r.month_growth>0?'<div class="bar"><i style="width:'+(100*r.month_growth/maxg).toFixed(0)+'%"></i></div>':'';
    return '<tr class="r'+(r.red_card?1:0)+'">'
      +'<td class="num" style="color:var(--t3)">'+(i+1)+'</td>'
      +'<td><b><a class="sig" href="https://algoforest.com/signals/'+encodeURIComponent(r.signal)+'" target="_blank" rel="noopener noreferrer">'+esc(r.signal)+'</a></b></td><td>'+esc(r.symbol)+'</td><td style="color:'+((r.ea&&r.ea!=='UNK')?'var(--t1)':'var(--t3)')+'">'+esc(r.ea||'—')+'</td>'
      +'<td class="num">'+(r.dde_score===null?'—':r.dde_score.toFixed(1))+'</td>'
      +'<td class="num">'+r.trades+'</td>'
      +'<td class="num">'+(r.win_rate===null?'—':r.win_rate.toFixed(1))+'</td>'
      +'<td class="num '+(r.pf>=1.5?'grn':(r.pf>=1?'amb':'red'))+'">'+(r.pf===null?'—':r.pf.toFixed(2))+'</td>'
      +'<td>'+(r.red_card?'<span class="red">🔴 '+r.red_reasons.length+' 因</span>':'<span class="grn">—</span>')+'</td>'
      +'<td class="num '+mgc+'">'+mg+bar+'</td>'
      +'<td style="color:var(--t3)">'+esc(r.month_key||'—')+'</td></tr>';
  }).join('');
  $('cnt').textContent='顯示 '+view.length+' / '+ROWS.length+' 行';
}
function markArrows(){
  document.querySelectorAll('th.sortable').forEach(th=>{
    th.querySelector('.arr').textContent = th.dataset.k===state.k ? (state.dir<0?'↓':'↑') : '';
    if(th.dataset.k===state.k) th.setAttribute('aria-sort', state.dir<0?'descending':'ascending');
    else th.removeAttribute('aria-sort');
  });
}
document.querySelectorAll('th.sortable').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.k;
  if(state.k===k) state.dir*=-1; else { state.k=k; state.dir=(k==='signal'||k==='symbol'||k==='ea'||k==='month_key')?1:-1; }
  markArrows(); render();
}));
let deb=null;
$('fq').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(render,150)});
$('fs').addEventListener('change',render); $('fm').addEventListener('change',render); $('fr').addEventListener('change',render);
fetch('home/projection.json').then(r=>r.json()).then(d=>{
  ROWS=d.rows;
  document.getElementById('meta').textContent =
    '生成 '+d.generated_at+' ｜預設排序：當月增長 ↓（可點欄頭切換 asc/desc）｜'+d.rows.length+' 行（dde_scores × decision_ranking）';
  document.getElementById('foot').textContent =
    '來源：'+d.source;
  /* 篩選下拉選項由數據動態生成 */
  const syms=[...new Set(ROWS.map(r=>r.symbol))].sort();
  $('fs').innerHTML='<option value="">商品：全部</option>'+syms.map(s=>'<option>'+esc(s)+'</option>').join('');
  const months=[...new Set(ROWS.map(r=>r.month_key).filter(Boolean))].sort().reverse();
  $('fm').innerHTML='<option value="">月份：全部</option>'+months.map(m=>'<option>'+esc(m)+'</option>').join('');
  markArrows(); render();
}).catch(e=>{document.getElementById('err').textContent='載入失敗：'+e});
fetch('home/accounts.json').then(r=>r.json()).then(ax=>{
  const el=document.getElementById('acctBadge');
  if(ax.status==='LIVE'&&ax.accounts&&ax.accounts[0]){
    const a0=ax.accounts[0];
    el.innerHTML='<span class="lamp" style="background:#28a745"></span>'+a0.server+' '+a0.balance.toFixed(2)+' '+a0.currency;
  } else {
    el.innerHTML='<span class="lamp off"></span>MT5 帳戶 N/A';
  }
}).catch(()=>{});
</script><script>(function(){var d=document.getElementById('navDrawer'),b=document.getElementById('burgerBtn'),x=document.getElementById('navDrawerClose');if(!d||!b||!x)return;var bar=[].map.call(document.querySelectorAll('.nav>a'),function(a){return a.getAttribute('href')});var dr=[].map.call(document.querySelectorAll('.navdrawer nav>a'),function(a){return a.getAttribute('href')});if(JSON.stringify(bar)!==JSON.stringify(dr))console.error('[nav] bar/drawer 清單唔一致',bar,dr);function open(){d.hidden=false;b.setAttribute('aria-expanded','true');x.focus()}function close(){d.hidden=true;b.setAttribute('aria-expanded','false');b.focus()}b.addEventListener('click',open);x.addEventListener('click',close);d.addEventListener('click',function(e){if(e.target===d)close()});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!d.hidden)close()});})();</script></body></html>
