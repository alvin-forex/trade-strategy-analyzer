<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading History Analyzer — 獨立分析頁（v1）</title>
<style>
:root{--bg:#0f1720;--card:#17222e;--line:#243343;--ink:#e6eef7;--mut:#8fa4b8;--good:#39b785;--bad:#d9534f;--acc:#5aa9e6;--warn:#e0a13c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;color:var(--acc)}
h3{font-size:13px;margin:14px 0 6px;color:var(--mut);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-size:12px;font-weight:600}
.n{text-align:right}
.pos{color:var(--good)}.neg{color:var(--bad)}
.drop{border:2px dashed #3a4c60;border-radius:10px;padding:26px;text-align:center;color:var(--mut)}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{flex:1;min-width:150px;background:#0f1a24;border:1px solid var(--line);border-radius:8px;padding:10px}
.kpi b{display:block;font-size:19px}
.kpi span{font-size:11px;color:var(--mut)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;color:#08131c;background:var(--warn)}
input[type=number],select{background:#0f1a24;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 8px}
button{background:var(--acc);border:0;color:#08131c;font-weight:700;border-radius:6px;padding:7px 14px;cursor:pointer}
.mut{color:var(--mut);font-size:12px}
.heat td{text-align:center;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Trading History Analyzer — 獨立分析頁 <span class="tag">v1</span></h1>
  <div class="sub">上載 MT4／MT5 交易紀錄 CSV 即時計算。全頁在你瀏覽器內運算，不上傳任何資料。不需要 TSA 系統。</div>

  <div class="card">
    <h2>① 上載交易紀錄</h2>
    <input type="file" id="file" accept=".csv,.txt">
    <div class="mut" style="margin-top:8px">需要欄位（MT4 Detailed Statement 或 THA RawData 格式）：Open Time、Type、Lots、Symbol、Open Price、Close Time、Close Price、Net Pips、Net Profit、Max Pips、Max Loss Pips、Magic Number、Comment。缺欄會提示。</div>
    <div class="drop" id="drop" style="margin-top:10px">把 CSV 拖到這裡，或按上面揀檔</div>
  </div>

  <div id="out"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const fmt = (x, d=2) => (x===null||x===undefined||isNaN(x)) ? "-" : Number(x).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = x => isNaN(x) ? "-" : (x*100).toFixed(1)+"%";
let TRADES = [];

$('#file').addEventListener('change', e => { if (e.target.files[0]) readFile(e.target.files[0]); });
const drop = $('#drop');
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.style.borderColor='#5aa9e6'; }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.style.borderColor='#3a4c60'; }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });

function readFile(f){
  const r = new FileReader();
  r.onload = () => { try { parseCSV(r.result); } catch(err){ alert('解析失敗：'+err.message); } };
  r.readAsText(f, 'utf-8');
  drop.textContent = '已載入：' + f.name;
}

function splitLine(line){
  const out=[]; let cur='', q=false;
  for (let i=0;i<line.length;i++){
    const c=line[i];
    if (c==='"'){ if (q && line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if (c===',' && !q){ out.push(cur); cur=''; }
    else cur+=c;
  }
  out.push(cur); return out;
}
function parseCSV(text){
  text = text.replace(/^\uFEFF/,'');
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  const head = splitLine(lines[0]).map(h=>h.trim());
  const idx = {};
  head.forEach((h,i)=> idx[h.replace(/\s+/g,' ')] = i);
  const find = (...names) => { for (const n of names){ if (n in idx) return idx[n]; } return -1; };
  const ci = {
    t0: find('Open Time','OpenTime'),
    type: find('Type'),
    lots: find('Lots','Volume'),
    sym: find('Symbol','Item'),
    p0: find('Open Price','Price'),
    t1: find('Close Time','CloseTime'),
    p1: find('Close Price'),
    pips: find('Net Pips','Pips'),
    profit: find('Net Profit','Profit'),
    mfe: find('Max Pips','Max Profit Pips'),
    mae: find('Max Loss Pips','Min Pips'),
    magic: find('Magic Number','Magic'),
    comment: find('Comment')
  };
  const need = ['t0','type','lots','sym','pips'];
  const miss = need.filter(k => ci[k] < 0);
  if (miss.length) { alert('缺少必要欄位：' + miss.join('、')); return; }

  TRADES = [];
  for (let i=1;i<lines.length;i++){
    const c = splitLine(lines[i]);
    const t = (c[ci.type]||'').trim().toLowerCase();
    if (t !== 'buy' && t !== 'sell') continue;
    const num = v => { const x = parseFloat(String(v||'').replace(/,/g,'')); return isNaN(x)?0:x; };
    TRADES.push({
      t0: (c[ci.t0]||'').trim(), t1: ci.t1>=0 ? (c[ci.t1]||'').trim() : '',
      dir: t, lots: num(c[ci.lots]), sym: (c[ci.sym]||'').trim(),
      p0: ci.p0>=0?num(c[ci.p0]):0, p1: ci.p1>=0?num(c[ci.p1]):0,
      pips: num(c[ci.pips]), profit: ci.profit>=0?num(c[ci.profit]):0,
      mfe: Math.abs(ci.mfe>=0?num(c[ci.mfe]):0), mae: Math.abs(ci.mae>=0?num(c[ci.mae]):0),
      magic: ci.magic>=0?(c[ci.magic]||'').trim():'', comment: ci.comment>=0?(c[ci.comment]||'').trim():''
    });
  }
  if (!TRADES.length){ alert('沒有可分析交易（Type 只有 buy／sell 才計）'); return; }
  assignLayers();
  render();
}

function assignLayers(){
  const lots = [...new Set(TRADES.map(t=>t.lots))].sort((a,b)=>a-b);
  const map = new Map(lots.map((v,i)=>[v,i+1]));
  TRADES.forEach(t=> t.layer = map.get(t.lots));
  window.LOTMAP = lots;
}

function stats(arr){
  const n = arr.length, wins = arr.filter(t=>t.pips>0);
  const gp = wins.reduce((s,t)=>s+t.pips,0);
  const loss = arr.filter(t=>t.pips<=0);
  const gl = loss.reduce((s,t)=>s+Math.abs(t.pips),0);
  const netPips = arr.reduce((s,t)=>s+t.pips,0);
  const netMoney = arr.reduce((s,t)=>s+t.profit,0);
  const wr = n? wins.length/n : NaN;
  const pf = gl? gp/gl : (gp? Infinity : NaN);
  const avgW = wins.length? gp/wins.length : 0;
  const avgL = loss.length? gl/loss.length : 0;
  // 最大回撤（累積 pips）
  let cum=0, peak=0, dd=0;
  [...arr].sort((a,b)=> a.order-b.order).forEach(t=>{ cum+=t.pips; peak=Math.max(peak,cum); dd=Math.min(dd,cum-peak); });
  return {n, wr, pf, netPips, netMoney, avgW, avgL, dd};
}

function render(){
  TRADES.forEach((t,i)=> t.order=i);
  const all = stats(TRADES);
  const html = [];
  html.push(`<div class="card"><h2>② 總覽</h2><div class="kpis">
    <div class="kpi"><b>${all.n}</b><span>交易筆數</span></div>
    <div class="kpi"><b class="${all.netPips>=0?'pos':'neg'}">${fmt(all.netPips,1)}</b><span>淨點數（pips）</span></div>
    <div class="kpi"><b class="${all.netMoney>=0?'pos':'neg'}">${fmt(all.netMoney,2)}</b><span>淨盈虧（金額）</span></div>
    <div class="kpi"><b>${pct(all.wr)}</b><span>勝率</span></div>
    <div class="kpi"><b>${isFinite(all.pf)?fmt(all.pf,2):'∞'}</b><span>盈利因子</span></div>
    <div class="kpi"><b class="neg">${fmt(all.dd,1)}</b><span>最大回撤（pips）</span></div>
  </div></div>`);

  // 分層
  const layerRows = [...new Set(TRADES.map(t=>t.layer))].sort((a,b)=>a-b);
  html.push(`<div class="card"><h2>③ 手數分層（L1＝最細手數，對齊白皮書 §3.1）</h2><table><tr><th>層</th><th class="n">手數</th><th class="n">筆數</th><th class="n">佔比</th><th class="n">淨 pips</th><th class="n">勝率</th><th class="n">每筆平均 pips</th></tr>`);
  layerRows.forEach(L=>{
    const arr = TRADES.filter(t=>t.layer===L), s = stats(arr);
    html.push(`<tr><td>L${L}</td><td class="n">${LOTMAP[L-1]}</td><td class="n">${s.n}</td><td class="n">${pct(s.n/all.n)}</td>
      <td class="n ${s.netPips>=0?'pos':'neg'}">${fmt(s.netPips,1)}</td><td class="n">${pct(s.wr)}</td>
      <td class="n ${(s.netPips/s.n)>=0?'pos':'neg'}">${fmt(s.netPips/s.n,1)}</td></tr>`);
  });
  html.push(`</table><div class="mut" style="margin-top:6px">提示：層數越多、越深，代表馬丁加倉越重。</div></div>`);

  // 商品 × 方向
  const keys = [...new Set(TRADES.map(t=>t.sym))].sort();
  html.push(`<div class="card"><h2>④ 商品 × 方向</h2><table><tr><th>商品</th><th>方向</th><th class="n">筆數</th><th class="n">淨 pips</th><th class="n">勝率</th><th class="n">盈利因子</th><th class="n">每筆平均</th></tr>`);
  keys.forEach(sym=>{
    ['buy','sell'].forEach(d=>{
      const arr = TRADES.filter(t=>t.sym===sym && t.dir===d);
      if (!arr.length) return;
      const s = stats(arr);
      html.push(`<tr><td>${sym}</td><td>${d.toUpperCase()}</td><td class="n">${s.n}</td>
        <td class="n ${s.netPips>=0?'pos':'neg'}">${fmt(s.netPips,1)}</td><td class="n">${pct(s.wr)}</td>
        <td class="n">${isFinite(s.pf)?fmt(s.pf,2):'∞'}</td><td class="n ${(s.netPips/s.n)>=0?'pos':'neg'}">${fmt(s.netPips/s.n,1)}</td></tr>`);
    });
  });
  html.push(`</table></div>`);

  // 延遲入場（近似）
  html.push(renderDelay());

  html.push(`<div class="card"><div class="mut">本頁 v1：全部計算在瀏覽器完成，無後端。延遲入場為「近似法」（用 Max Pips／Max Loss 推算，未用逐分鐘路徑）；精確版需另行提供分鐘資料。</div></div>`);
  $('#out').innerHTML = html.join('');
}

function renderDelay(){
  const XS=[0,10,20,30,40,50], SS=[10,15,20], TS=[50,100];
  const layerRows=[...new Set(TRADES.map(t=>t.layer))].sort((a,b)=>a-b);
  let h = `<div class="card"><h2>⑤ 延遲入場（近似法）— 每層最佳組合</h2>
  <div class="mut">口徑：由原入場價逆走 D 點才入場；由新入場價再逆走 S 點止蝕；目標回到原入場價 ±T 點。<b>此為近似</b>（用 Max Pips／Max Loss 推算，假設同一路徑），<b>不可作最終結論</b>。</div>
  <table style="margin-top:8px"><tr><th>層</th><th class="n">最佳 D</th><th class="n">S</th><th class="n">T</th><th class="n">觸發率</th><th class="n">勝率</th><th class="n">賠率</th><th class="n">每筆原始交易期望(pips)</th><th class="n">D=0 對照</th></tr>`;
  layerRows.forEach(L=>{
    const arr=TRADES.filter(t=>t.layer===L); if (arr.length<20) return;
    let best=null;
    XS.forEach(D=>SS.forEach(S=>TS.forEach(T=>{
      let trig=0, sum=0, wins=0, gp=0, gl=0;
      arr.forEach(t=>{
        const exc = t.mae;           // 逆勢延遲：先要走到 D
        if (exc + 1e-9 < D) return;
        trig++;
        const res = t.pips + D;      // 入場價更好 D 點
        sum += res;
        if (res>0){ wins++; gp+=res; } else { gl+=Math.abs(res); }
      });
      if (trig < 10) return;
      const exp = sum/arr.length;
      const cand = {D,S,T,trig:trig/arr.length, wr:wins/trig, odds:(gl? (gp/wins)/(gl/(trig-wins||1)) : Infinity), exp};
      if (!best || cand.exp > best.exp) best = cand;
    })));
    if (!best) { h += `<tr><td>L${L}</td><td colspan="8" class="mut">樣本不足</td></tr>`; return; }
    // D=0 對照（同 S,T）
    let sum0=0; arr.forEach(t=>{ sum0 += t.pips; });
    h += `<tr><td>L${L}</td><td class="n">${best.D}</td><td class="n">${best.S}</td><td class="n">${best.T}</td>
      <td class="n">${pct(best.trig)}</td><td class="n">${pct(best.wr)}</td><td class="n">${isFinite(best.odds)?fmt(best.odds,2):'∞'}</td>
      <td class="n ${best.exp>=0?'pos':'neg'}">${fmt(best.exp,1)}</td><td class="n">${fmt(sum0/arr.length,1)}</td></tr>`;
  });
  h += `</table></div>`;
  return h;
}
</script>
</body>
</html>
